# Libraries

# Admin stylesheet
apsc-admin-styles:
  version: 1.x
  css:
    layout:
      css/admin.css: {}

# Cookiebot
cookiebot-script:
  js:
    https://consent.cookiebot.com/uc.js:
      type: external
      attributes:
        id: Cookiebot
        data-cbid: ''
        data-blockingmode: auto

cookiebot-banner-styles:
  css:
    theme:
      css/cookie-styles.css: {}

cookiebot-iframe-consent:
  js:
    js/cookiebot-iframe-consent.js : {}

### Tiny Slider for Cookiebot
tiny-slider-cookiebot:
  header: true
  js:
    js/tiny.slider.min.js:
      preprocess: false
      minified: true
      attributes:
        data-cookieconsent: ignore
